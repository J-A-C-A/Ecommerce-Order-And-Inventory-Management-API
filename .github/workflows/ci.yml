name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run migrations
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test_db
          SECRET_KEY: test-secret-key
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USERNAME: test
          SMTP_PASSWORD: test
          SMTP_FROM_EMAIL: test@example.com
          ENV_FILE: .env.test
        run: alembic upgrade head

      - name: Run tests
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test_db
          SECRET_KEY: test-secret-key
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USERNAME: test
          SMTP_PASSWORD: test
          SMTP_FROM_EMAIL: test@example.com
          ENV_FILE: .env.test
        run: pytest -v