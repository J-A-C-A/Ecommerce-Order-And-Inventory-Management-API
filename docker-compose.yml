services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.utils.celery_app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A app.utils.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data: